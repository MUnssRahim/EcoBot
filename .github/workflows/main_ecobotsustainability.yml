name: Azure Static Web Apps CI/CD - EcoBot Frontend

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # 🔑 Your exact token is hardcoded right here:
          azure_static_web_apps_api_token: "6fa4491de1197906cf1572b64a258f0a8b480563c5c2bd9fbb61d2793354e53e01-e06d756c-359a-4e02-aa81-3f074ed2698000028190e5e7de00"
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          
          # 📂 The exact folder routing you need:
          app_location: "/frontend"
          api_location: ""
          output_location: ".next"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          # 🔑 Token hardcoded here for PR closures too:
          azure_static_web_apps_api_token: "6fa4491de1197906cf1572b64a258f0a8b480563c5c2bd9fbb61d2793354e53e01-e06d756c-359a-4e02-aa81-3f074ed2698000028190e5e7de00"
          action: "close"
